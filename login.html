<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Portfolio de Lucas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <main class="container py-5">
        <section class="card shadow-sm mx-auto" style="max-width: 420px;">
            <div class="card-body p-4">
                <h1 class="h3 mb-1">Iniciar sesión</h1>
                <p class="text-muted">Portfolio personal de Lucas</p>
                <form id="formulario-login">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" id="username" class="form-control" autocomplete="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" class="form-control" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Ingresar</button>
                    <p id="mensaje-login" class="text-danger mt-3 mb-0" role="status"></p>
                </form>
                <p class="small text-muted mt-3 mb-0">Usuarios de prueba: <strong>admin</strong> / <strong>1234</strong> o <strong>usuario</strong> / <strong>pass123</strong>.</p>
            </div>
        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>
