<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Lucas</title>
    <link rel="stylesheet" href="estilos.css?v=3">
    <script src="usuarios.js" defer></script>
</head>
<body>
    <header>
        <nav aria-label="Menú principal">
            <a href="index.html">Volver al portfolio</a>
            <a href="registro.html">Registrarse</a>
            <a href="login.html" aria-current="page">Administración</a>
        </nav>
    </header>
    <main class="pagina-usuarios">
        <section class="tarjeta-usuarios">
            <h1>Ingreso del administrador</h1>
            <p>Ingresá para consultar la lista de clientes.</p>
            <form id="formulario-login">
                <div class="campo">
                    <label for="username">Usuario</label>
                    <input id="username" name="username" type="text" autocomplete="username" required>
                </div>
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button type="submit">Ingresar</button>
                <p id="estado-login" role="status"></p>
            </form>
            <p class="aviso">Acceso de prueba: usuario <strong>admin</strong> y contraseña <strong>1234</strong>. Es una simulación escolar.</p>
        </section>
    </main>
</body>
</html>
