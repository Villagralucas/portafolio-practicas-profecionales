<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de clientes - Lucas</title>
    <link rel="stylesheet" href="estilos.css?v=3">
    <script src="usuarios.js" defer></script>
</head>
<body>
    <header>
        <nav aria-label="Menú principal">
            <a href="index.html">Volver al portfolio</a>
            <a href="registro.html">Registrar cliente</a>
        </nav>
    </header>
    <main id="panel-admin" hidden>
        <section>
            <h1>Clientes registrados</h1>
            <p id="estado-clientes" role="status"></p>
            <div class="tabla-clientes">
                <table>
                    <caption>Lista de clientes del portfolio</caption>
                    <thead>
                        <tr>
                            <th scope="col">Nombre</th>
                            <th scope="col">Apellido</th>
                            <th scope="col">DNI</th>
                            <th scope="col">Mail</th>
                        </tr>
                    </thead>
                    <tbody id="lista-clientes"></tbody>
                </table>
            </div>
            <button id="cerrar-sesion" type="button">Cerrar sesión</button>
        </section>
    </main>
</body>
</html>
